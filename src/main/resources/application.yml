spring:
  application:
    name: pet
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/utka}
    username: ${SPRING_DATASOURCE_USERNAME:utka}
    password: ${SPRING_DATASOURCE_PASSWORD:utka}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: public
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789}
    expiry-ms: 86400000
  bootstrap:
    enabled: true
    admin-username: admin
    admin-password: admin
    user-username: user
    user-password: user
