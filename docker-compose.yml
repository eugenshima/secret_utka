services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: utka
      POSTGRES_PASSWORD: utka
      POSTGRES_DB: utka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utka -d utka"]
      interval: 5s
      timeout: 5s
      retries: 5

#  redis:
#    image: redis:7-alpine
#    ports:
#      - "6379:6379"
#    healthcheck:
#      test: ["CMD", "redis-cli", "ping"]
#      interval: 5s
#      timeout: 3s
#      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/utka
      SPRING_DATASOURCE_USERNAME: utka
      SPRING_DATASOURCE_PASSWORD: utka
#      SPRING_DATA_REDIS_HOST: redis
#      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
#      redis:
#        condition: service_healthy

volumes:
  postgres_data:
